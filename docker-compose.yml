services:

  db:
    image: postgres:16
    container_name: sql-lab-db

    environment:
      POSTGRES_DB: sql_lab
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: